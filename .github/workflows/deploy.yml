name: Deploy gh-proxy-rs

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Worker 名称前缀，例如 hk / jp / cf"
        required: false
        default: ""
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node dependencies
        run: npm install

      - name: Install worker-build
        run: cargo install worker-build@0.1.13

      - name: Build Worker
        run: worker-build --release

      - name: Set Worker name
        env:
          PREFIX: ${{ inputs.prefix }}
        run: |
          if [ -n "$PREFIX" ]; then
            WORKER_NAME="${PREFIX}-gh-proxy-rs"
          else
            WORKER_NAME="gh-proxy-rs"
          fi

          echo "Worker name: $WORKER_NAME"
          echo "WORKER_NAME=$WORKER_NAME" >> "$GITHUB_ENV"

      - name: Show build output
        run: |
          echo "=== build/worker ==="
          find build/worker -maxdepth 2 -type f -print

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --name "$WORKER_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}